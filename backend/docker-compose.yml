version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: nagarseva_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: nagarseva_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - nagarseva-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: nagarseva_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nagarseva-network
    command: redis-server --appendonly yes
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nagarseva_backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://admin:password@mongodb:27017
      MONGODB_DATABASE: nagarseva_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DEBUG: "True"
      ENVIRONMENT: development
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
    networks:
      - nagarseva-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nagarseva_celery_worker
    environment:
      MONGODB_URL: mongodb://admin:password@mongodb:27017
      MONGODB_DATABASE: nagarseva_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DEBUG: "True"
      ENVIRONMENT: development
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./app:/app/app
    networks:
      - nagarseva-network
    command: celery -A app.tasks.celery_tasks worker --loglevel=info

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nagarseva_celery_beat
    environment:
      MONGODB_URL: mongodb://admin:password@mongodb:27017
      MONGODB_DATABASE: nagarseva_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DEBUG: "True"
      ENVIRONMENT: development
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./app:/app/app
    networks:
      - nagarseva-network
    command: celery -A app.tasks.celery_tasks beat --loglevel=info

  # MongoDB Admin UI (optional)
  mongo-express:
    image: mongo-express:latest
    container_name: nagarseva_mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - nagarseva-network

networks:
  nagarseva-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
